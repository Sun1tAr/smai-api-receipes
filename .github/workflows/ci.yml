name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Новый запуск для того же PR отменяет предыдущий; запуски веток не отменяются.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Публикация образа и деплой (stage/prod, ghcr, repository-dispatch) здесь
# намеренно не описаны: это решение Ivan и DevOps, их добавят отдельной задачей.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run pytest tests/unit -p no:cacheprovider -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p receipes-tests -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from tests
      - if: always()
        run: docker compose -p receipes-tests -f docker-compose.test.yml down -v

  # Проверяет собранный образ в Compose: миграции, старт, health, docs.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: |
          curl --fail --silent --show-error http://127.0.0.1:8001/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/docs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  docker-build:
    needs: [lint, unit, integration, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
