name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

# Деплой (stage/prod) остаётся за DevOps и в этом файле намеренно не описан.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run pytest tests/unit -p no:cacheprovider -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p receipes-tests -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from tests
          docker compose -p receipes-tests -f docker-compose.test.yml down

  docker-build:
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
